<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:681px;height:388px;background:#FFFFFF;" width="681px" height="388px" viewBox="0 0 681 388" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="11"><text x="225.629" y="22.995" fill="#000" font-size="14" textLength="222.742" font-weight="700">COLORS - Use Case Diagram</text></g><!--cluster COLORS Web Application--><g class="cluster" data-qualified-name="COLORS Web Application" id="ent0002" data-source-line="14"><rect x="62" y="44.297" width="242" height="253" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="69.934" y="61.148" fill="#000" font-size="16" textLength="226.133" font-weight="700">COLORS Web Application</text></g><!--entity User--><g class="entity" data-qualified-name="User" id="ent0001" data-source-line="13"><ellipse cx="24.234" cy="152.297" rx="8" ry="8" fill="#F1F1F1" style="stroke:#374151;stroke-width:0.5;"/><path d="M24.234,160.297 L24.234,187.297 M11.234,168.297 L37.234,168.297 M24.234,187.297 L11.234,202.297 M24.234,187.297 L37.234,202.297" style="stroke:#374151;stroke-width:0.5;" fill="none"/><text x="6" y="218.648" fill="#000" font-size="16" textLength="36.469">User</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="26"><path d="M346,41.297 L346,85.08 L220.278,101.619 L346,93.08 L346,107.172 A0,0 0 0 0 346,107.172 L643.375,107.172 A0,0 0 0 0 643.375,107.172 L643.375,51.297 L633.375,41.297 L346,41.297 A0,0 0 0 0 346,41.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M633.375,41.297 L633.375,51.297 L643.375,51.297 L633.375,41.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="352" y="61.148" fill="#000" font-size="16" textLength="276.375">Supply a username and password.</text><text x="352" y="79.773" fill="#000" font-size="16" textLength="261.07">A matching Users record returns</text><text x="352" y="98.398" fill="#000" font-size="16" textLength="191.836">the user's ID and name.</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="31"><path d="M324,125.797 L324,157.184 L239.28,157.636 L324,165.184 L324,210.297 A0,0 0 0 0 324,210.297 L664.977,210.297 A0,0 0 0 0 664.977,210.297 L664.977,135.797 L654.977,125.797 L324,125.797 A0,0 0 0 0 324,125.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M654.977,125.797 L654.977,135.797 L664.977,135.797 L654.977,125.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="330" y="145.648" fill="#000" font-size="16" textLength="310.461">Browser precondition for color actions:</text><text x="330" y="164.273" fill="#000" font-size="16" textLength="319.977">user state loaded from the login cookie.</text><text x="330" y="182.898" fill="#000" font-size="16" textLength="303.133">Add and search requests send userId.</text><text x="330" y="201.523" fill="#000" font-size="16" textLength="276.266">Search filters by name and userId.</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="37"><path d="M355.5,241.797 L355.5,261.297 L228.246,265.297 L355.5,269.297 L355.5,289.047 A0,0 0 0 0 355.5,289.047 L633.906,289.047 A0,0 0 0 0 633.906,289.047 L633.906,251.797 L623.906,241.797 L355.5,241.797 A0,0 0 0 0 355.5,241.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M623.906,241.797 L623.906,251.797 L633.906,251.797 L623.906,241.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="361.5" y="261.648" fill="#000" font-size="16" textLength="257.406">Clear browser user state, expire</text><text x="361.5" y="280.273" fill="#000" font-size="16" textLength="248.484">the cookie, and return to login.</text></g><!--entity Login--><g class="entity" data-qualified-name="COLORS Web Application.Login" id="ent0003" data-source-line="15"><ellipse cx="182.317" cy="105.467" rx="37.317" ry="16.17" fill="#F3F4F6" style="stroke:#374151;stroke-width:0.5;"/><text x="158.051" y="111.279" fill="#000" font-size="16" textLength="48.531">Log in</text></g><!--entity Add--><g class="entity" data-qualified-name="COLORS Web Application.Add" id="ent0004" data-source-line="16"><ellipse cx="182.558" cy="155.467" rx="56.558" ry="16.17" fill="#F3F4F6" style="stroke:#374151;stroke-width:0.5;"/><text x="144.687" y="161.279" fill="#000" font-size="16" textLength="75.742">Add color</text></g><!--entity Search--><g class="entity" data-qualified-name="COLORS Web Application.Search" id="ent0005" data-source-line="17"><ellipse cx="182.688" cy="210.134" rx="89.688" ry="20.338" fill="#F3F4F6" style="stroke:#374151;stroke-width:0.5;"/><text x="109.567" y="215.947" fill="#000" font-size="16" textLength="146.242">Search own colors</text></g><!--entity Logout--><g class="entity" data-qualified-name="COLORS Web Application.Logout" id="ent0006" data-source-line="18"><ellipse cx="182.531" cy="265.467" rx="45.531" ry="16.17" fill="#F3F4F6" style="stroke:#374151;stroke-width:0.5;"/><text x="152.457" y="271.279" fill="#000" font-size="16" textLength="60.148">Log out</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk7" data-link-type="association"><path d="M42.012,150.707 C47.448,142.985 54.135,135.493 62,130.297 C86.583,114.058 119.7,108.083 144.837,106.014" style="stroke:#374151;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk8" data-link-type="association"><path d="M42.046,180.247 C62.089,176.661 96.375,170.527 125.934,165.238" style="stroke:#374151;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk9" data-link-type="association"><path d="M42.046,186.238 C54.801,188.438 73.323,191.634 92.725,194.981" style="stroke:#374151;stroke-width:1;" fill="non